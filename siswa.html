<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Siswa - Sistem Sekolah (Demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { brand: {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#166534',800:'#14532d',900:'#052e16'} },
    fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
  } } };
</script>
</head>
<body class="h-full bg-zinc-50 font-sans antialiased">
<div id="demo-banner" class="bg-zinc-900 py-1.5 text-center text-xs font-medium text-white/80"></div>
<div class="flex h-[calc(100%-28px)]">
  <aside id="app-sidebar-wrap" class="hidden w-64 shrink-0 border-r border-zinc-200 bg-white lg:flex lg:flex-col">
    <div id="app-sidebar" class="flex h-full flex-col"></div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header id="app-topbar" class="flex items-center gap-3 border-b border-zinc-200 bg-white px-4 py-3"></header>
    <main id="page-content" class="flex-1 overflow-y-auto p-4 sm:p-6"></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  const session = renderShell('siswa.html');
  let classFilter = '';
  let term = '';

  function rows() {
    return STUDENTS.filter((s) =>
      (!classFilter || s.classroom === classFilter) &&
      (!term || s.name.toLowerCase().includes(term.toLowerCase())));
  }

  function renderTable() {
    const list = rows();
    document.getElementById('student-count').textContent = `${list.length} siswa`;

    document.getElementById('student-table-body').innerHTML = list.map((s) => `
      <tr class="border-b border-zinc-100 last:border-0">
        <td class="px-4 py-2.5 text-sm font-medium text-zinc-900">${s.name}</td>
        <td class="px-4 py-2.5 text-sm text-zinc-500">${s.gender === 'L' ? 'Laki-laki' : 'Perempuan'}</td>
        <td class="px-4 py-2.5 text-sm tabular-nums text-zinc-500">${s.nisn}</td>
        <td class="px-4 py-2.5 text-sm tabular-nums text-zinc-500">${s.nis}</td>
        <td class="px-4 py-2.5"><span class="rounded-full bg-brand-50 px-2.5 py-1 text-xs font-semibold text-brand-800">${s.classroom}</span></td>
        <td class="px-4 py-2.5 text-right">
          <button type="button" data-inert class="rounded-lg px-2 py-1 text-xs font-semibold text-brand-700 hover:bg-brand-50">Lihat</button>
        </td>
      </tr>`).join('');

    document.getElementById('student-cards').innerHTML = list.map((s) => `
      <div class="rounded-xl border border-zinc-200 bg-white p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <p class="font-semibold text-zinc-900">${s.name}</p>
          <span class="rounded-full bg-brand-50 px-2 py-0.5 text-xs font-semibold text-brand-800">${s.classroom}</span>
        </div>
        <p class="mt-1 text-sm text-zinc-500">${s.gender === 'L' ? 'Laki-laki' : 'Perempuan'} · NISN ${s.nisn} · NIS ${s.nis}</p>
      </div>`).join('');

    inert('[data-inert]', 'Ini demo tampilan — fitur ini tidak aktif.');
  }

  if (session) {
    document.getElementById('page-content').innerHTML = `
      <div class="flex flex-col gap-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-xl font-bold text-zinc-900">Data Siswa</h1>
            <p class="mt-1 text-sm text-zinc-500">${STUDENTS.length} siswa aktif di 3 rombongan belajar.</p>
          </div>
          <div class="flex gap-2">
            <button type="button" data-inert class="rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-50">Impor Excel</button>
            <button type="button" data-inert class="rounded-lg bg-brand-700 px-3 py-2 text-sm font-semibold text-white hover:bg-brand-800">+ Tambah Siswa</button>
          </div>
        </div>

        <div class="flex flex-wrap gap-2">
          <input id="search" type="text" placeholder="Cari nama siswa..." class="min-w-0 flex-1 rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
          <select id="class-select" class="rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
            <option value="">Semua kelas</option>
            <option value="VII A">VII A</option>
            <option value="VIII A">VIII A</option>
            <option value="IX A">IX A</option>
          </select>
        </div>

        <p id="student-count" class="text-sm text-zinc-500"></p>

        <div class="hidden overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm md:block">
          <table class="w-full text-left">
            <thead class="bg-zinc-50">
              <tr class="text-xs font-semibold uppercase tracking-wide text-zinc-500">
                <th class="px-4 py-2.5">Nama</th><th class="px-4 py-2.5">Jenis Kelamin</th>
                <th class="px-4 py-2.5">NISN</th><th class="px-4 py-2.5">NIS</th>
                <th class="px-4 py-2.5">Kelas</th><th class="px-4 py-2.5"></th>
              </tr>
            </thead>
            <tbody id="student-table-body"></tbody>
          </table>
        </div>

        <div id="student-cards" class="flex flex-col gap-3 md:hidden"></div>
      </div>`;

    document.getElementById('search').addEventListener('input', (e) => { term = e.target.value; renderTable(); });
    document.getElementById('class-select').addEventListener('change', (e) => { classFilter = e.target.value; renderTable(); });
    renderTable();
  }
</script>
</body>
</html>
