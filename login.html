<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk ke Sistem Sekolah (Demo)</title>
<meta name="description" content="Demo tampilan Sistem Sekolah — rapor madrasah otomatis. Halaman statis untuk contoh portofolio, data fiktif.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#166534',800:'#14532d',900:'#052e16'} },
        fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
</head>
<body class="flex min-h-full flex-col bg-gradient-to-b from-zinc-900 via-zinc-900 to-brand-950 font-sans antialiased" style="--tw-gradient-to: #052e16">

<div class="flex items-center justify-between bg-zinc-950 px-4 py-1.5 text-xs font-medium text-white/80">
  <a href="index.html" class="flex items-center gap-1 hover:text-white">
    <iconify-icon icon="heroicons:arrow-right" width="12" class="rotate-180"></iconify-icon> Beranda
  </a>
  <span><iconify-icon icon="heroicons:eye" class="-mt-0.5 inline-block align-middle"></iconify-icon> Demo tampilan · data fiktif</span>
</div>

<main class="flex flex-1 items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center gap-3 text-center">
      <span class="flex size-14 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-500 to-brand-800 text-white shadow-lg shadow-brand-900/40">
        <iconify-icon icon="heroicons:academic-cap" width="28"></iconify-icon>
      </span>
      <div>
        <h1 class="text-lg font-bold text-white">Masuk ke Sistem Sekolah</h1>
        <p class="mt-1 text-sm text-zinc-400">Isi nama pengguna dan password Anda.</p>
      </div>
    </div>

    <form id="login-form" class="mt-7 flex flex-col gap-4 rounded-2xl bg-white p-6 shadow-2xl">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-zinc-700">Nama pengguna</label>
        <input id="username" type="text" placeholder="NIP, NISN, atau nama pengguna" class="w-full rounded-lg border border-zinc-300 px-3 py-2.5 text-sm text-zinc-900 placeholder:text-zinc-400 focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-zinc-700">Password</label>
        <input id="password" type="password" placeholder="Password" class="w-full rounded-lg border border-zinc-300 px-3 py-2.5 text-sm text-zinc-900 placeholder:text-zinc-400 focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
      </div>
      <label class="flex items-center gap-2 text-sm text-zinc-600">
        <input type="checkbox" class="rounded border-zinc-300 text-brand-700 focus:ring-brand-600"> Ingat saya di perangkat ini
      </label>
      <button type="submit" class="mt-1 w-full rounded-lg bg-brand-700 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-800">Masuk</button>
      <p id="login-error" class="hidden text-center text-xs font-medium text-rose-600">Nama pengguna atau password salah. Coba salah satu akun contoh di bawah.</p>
      <p class="text-center text-xs text-zinc-400">Lupa password? Hubungi operator sekolah.</p>
    </form>

    <div class="mt-5 rounded-2xl bg-white/5 p-4 ring-1 ring-white/10">
      <p class="mb-3 flex items-center gap-1.5 text-xs font-semibold text-white/70">
        <iconify-icon icon="heroicons:shield-check" width="14"></iconify-icon> Akun contoh — klik untuk isi otomatis
      </p>
      <div class="flex flex-col gap-2" id="demo-accounts"></div>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script>
  const accountOrder = ['admin', 'guru', 'siswa'];
  document.getElementById('demo-accounts').innerHTML = accountOrder.map((key) => {
    const a = ACCOUNTS[key];
    return `
      <button type="button" data-role="${key}" class="demo-account-btn flex w-full items-center justify-between rounded-lg bg-white/5 px-3 py-2.5 text-left text-sm text-white transition hover:bg-white/10">
        <span>
          <span class="block font-medium">${a.roleLabel}</span>
          <span class="block text-xs text-white/50">${a.username} · ${a.password}</span>
        </span>
        <iconify-icon icon="heroicons:arrow-right" width="16" class="text-white/40"></iconify-icon>
      </button>`;
  }).join('');

  document.querySelectorAll('.demo-account-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const a = ACCOUNTS[btn.dataset.role];
      document.getElementById('username').value = a.username;
      document.getElementById('password').value = a.password;
    });
  });

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const match = Object.values(ACCOUNTS).find((a) => a.username === username);
    if (!match) {
      document.getElementById('login-error').classList.remove('hidden');
      return;
    }
    login(match.role);
  });
</script>
</body>
</html>
