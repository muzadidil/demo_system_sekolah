<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Harian - Sistem Sekolah (Demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { brand: {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#166534',800:'#14532d',900:'#052e16'} },
    fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
  } } };
</script>
</head>
<body class="h-full bg-zinc-50 font-sans antialiased">
<div id="demo-banner" class="bg-zinc-900 py-1.5 text-center text-xs font-medium text-white/80"></div>
<div class="flex h-[calc(100%-28px)]">
  <aside id="app-sidebar-wrap" class="hidden w-64 shrink-0 border-r border-zinc-200 bg-white lg:flex lg:flex-col">
    <div id="app-sidebar" class="flex h-full flex-col"></div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header id="app-topbar" class="flex items-center gap-3 border-b border-zinc-200 bg-white px-4 py-3"></header>
    <main id="page-content" class="flex-1 overflow-y-auto p-4 sm:p-6"></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  const session = renderShell('absensi.html');
  const STATUSES = [
    { key: 'hadir', label: 'Hadir', color: 'emerald' },
    { key: 'sakit', label: 'Sakit', color: 'amber' },
    { key: 'izin', label: 'Izin', color: 'sky' },
    { key: 'alpa', label: 'Alpa', color: 'rose' },
  ];
  const state = {};

  function pick(name, status) {
    state[name] = status;
    render();
  }

  function render() {
    const students = studentsIn('VIII A');
    document.getElementById('attendance-rows').innerHTML = students.map((s) => {
      const current = state[s.name] || 'hadir';
      return `
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-zinc-100 px-4 py-3 last:border-0">
        <p class="font-medium text-zinc-900">${s.name}</p>
        <div class="flex gap-1.5">
          ${STATUSES.map((st) => `
            <button type="button" onclick="pick('${s.name}','${st.key}')" class="rounded-lg px-2.5 py-1 text-xs font-semibold transition ${current === st.key ? `bg-${st.color}-600 text-white` : `bg-${st.color}-50 text-${st.color}-700 hover:bg-${st.color}-100`}">${st.label}</button>
          `).join('')}
        </div>
      </div>`;
    }).join('');
  }

  if (session) {
    document.getElementById('page-content').innerHTML = `
      <div class="flex flex-col gap-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-xl font-bold text-zinc-900">Absensi Harian</h1>
            <p class="mt-1 text-sm text-zinc-500">Kelas VIII A · Hari ini, ${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
          </div>
          <button type="button" data-inert class="rounded-lg bg-brand-700 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-800">Simpan Absensi</button>
        </div>
        <p class="text-xs text-zinc-400">Klik status tiap siswa. Ringkasan ini otomatis masuk ke rekap kehadiran di Rapor Kelas Saya.</p>
        <div class="overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm" id="attendance-rows"></div>
      </div>`;

    render();
    inert('[data-inert]', 'Ini demo tampilan — fitur ini tidak aktif.');
  }
</script>
</body>
</html>
