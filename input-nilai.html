<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Nilai - Sistem Sekolah (Demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { brand: {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#166534',800:'#14532d',900:'#052e16'} },
    fontFamily: { sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
  } } };
</script>
</head>
<body class="h-full bg-zinc-50 font-sans antialiased">
<div id="demo-banner" class="bg-zinc-900 py-1.5 text-center text-xs font-medium text-white/80"></div>
<div class="flex h-[calc(100%-28px)]">
  <aside id="app-sidebar-wrap" class="hidden w-64 shrink-0 border-r border-zinc-200 bg-white lg:flex lg:flex-col">
    <div id="app-sidebar" class="flex h-full flex-col"></div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header id="app-topbar" class="flex items-center gap-3 border-b border-zinc-200 bg-white px-4 py-3"></header>
    <main id="page-content" class="flex-1 overflow-y-auto p-4 sm:p-6"></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  const session = renderShell('input-nilai.html');
  let subjectIndex = 7; // Matematika

  function recalc(row) {
    const lm1 = Number(document.getElementById(`lm1-${row}`).value) || 0;
    const lm2 = Number(document.getElementById(`lm2-${row}`).value) || 0;
    const sas = Number(document.getElementById(`sas-${row}`).value) || 0;
    const final = Math.round((lm1 + lm2 + 2 * sas) / 4);
    document.getElementById(`final-${row}`).textContent = final;
  }

  function renderGrid() {
    const students = studentsIn('VIII A');
    const subject = SUBJECTS[subjectIndex];

    document.getElementById('subject-caption').textContent = `${subject} · Kelas VIII A · ${SCHOOL.termLabel} ${SCHOOL.yearLabel}`;

    document.getElementById('grade-table-body').innerHTML = students.map((s, i) => {
      const score = gradeFor(i, subjectIndex);
      return `
      <tr class="border-b border-zinc-100 last:border-0">
        <td class="px-3 py-2 text-sm text-zinc-400">${i + 1}</td>
        <td class="px-3 py-2 text-sm font-medium text-zinc-900">${s.name}</td>
        <td class="px-2 py-2"><input id="lm1-${i}" type="number" min="0" max="100" value="${score - 2}" oninput="recalc(${i})" class="w-16 rounded-md border border-zinc-300 px-2 py-1 text-center text-sm tabular-nums focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"></td>
        <td class="px-2 py-2"><input id="lm2-${i}" type="number" min="0" max="100" value="${score + 2}" oninput="recalc(${i})" class="w-16 rounded-md border border-zinc-300 px-2 py-1 text-center text-sm tabular-nums focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"></td>
        <td class="px-2 py-2"><input id="sas-${i}" type="number" min="0" max="100" value="${score}" oninput="recalc(${i})" class="w-16 rounded-md border border-zinc-300 px-2 py-1 text-center text-sm tabular-nums focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"></td>
        <td class="px-3 py-2 text-center text-sm font-bold tabular-nums text-brand-800" id="final-${i}">${score}</td>
        <td class="px-2 py-2 text-center">
          <button type="button" data-inert title="Catatan capaian kompetensi" class="rounded-lg p-1.5 text-zinc-400 hover:bg-zinc-100 hover:text-zinc-700">
            <iconify-icon icon="heroicons:pencil-square" width="16"></iconify-icon>
          </button>
        </td>
      </tr>`;
    }).join('');

    inert('[data-inert]', 'Ini demo tampilan — fitur ini tidak aktif.');
  }

  if (session) {
    document.getElementById('page-content').innerHTML = `
      <div class="flex flex-col gap-5">
        <div>
          <h1 class="text-xl font-bold text-zinc-900">Input Nilai</h1>
          <p class="mt-1 text-sm text-zinc-500">Isi nilai satu kelas sekaligus — rapor tersusun otomatis dari angka di sini.</p>
        </div>

        <div class="flex flex-wrap items-end gap-3">
          <div>
            <label class="mb-1 block text-xs font-medium text-zinc-500">Kelas</label>
            <select class="rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
              <option>VIII A</option>
            </select>
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-zinc-500">Mata pelajaran</label>
            <select id="subject-select" class="rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
              ${SUBJECTS.map((s, i) => `<option value="${i}" ${i === subjectIndex ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <button type="button" data-inert class="rounded-lg bg-brand-700 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-800">Simpan Nilai</button>
        </div>

        <div class="overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm">
          <div class="border-b border-zinc-100 px-4 py-3">
            <p id="subject-caption" class="text-sm font-semibold text-zinc-700"></p>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead class="bg-zinc-50">
                <tr class="text-xs font-semibold uppercase tracking-wide text-zinc-500">
                  <th class="px-3 py-2.5">No</th><th class="px-3 py-2.5">Nama</th>
                  <th class="px-2 py-2.5">Sumatif LM 1</th><th class="px-2 py-2.5">Sumatif LM 2</th>
                  <th class="px-2 py-2.5">Sumatif Akhir (×2)</th><th class="px-3 py-2.5 text-center">Nilai Akhir</th>
                  <th class="px-2 py-2.5"></th>
                </tr>
              </thead>
              <tbody id="grade-table-body"></tbody>
            </table>
          </div>
        </div>
        <p class="text-xs text-zinc-400">Ubah angka di kolom mana pun — Nilai Akhir terhitung otomatis (rata-rata tertimbang, Sumatif Akhir bobot 2×). Perubahan di demo ini tidak tersimpan.</p>
      </div>`;

    document.getElementById('subject-select').addEventListener('change', (e) => {
      subjectIndex = Number(e.target.value);
      renderGrid();
    });

    renderGrid();
  }
</script>
</body>
</html>
